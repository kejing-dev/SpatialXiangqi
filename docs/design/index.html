<style>
/* ============================================================================
 * 空间象棋 · Spatial Xiangqi — preview stylesheet
 * dp = px at 1:1 inside #scene; the scene is scaled as a whole to fit the
 * viewport (--scene-scale, set by script). Panel roots use the SpatialUI Web
 * Material.Regular glass recipe (variable --Background-MaterialRegular, the
 * same blur/saturate and inset border the bundle's overlayCss uses) with the
 * 32 dp window radius (--sui-dim-radius-extra-huge installed by PicoTheme).
 * Skins (紫檀 / 竹林 / 楚汉烽烟) are pure CSS variables on #scene[data-skin].
 * ========================================================================== */
:root {
  /* brand / decorative tokens outside ColorScheme (design-doc §3) */
  --boxwood: #E4C99B; --jade: #9DBFA7; --cinnabar: #B8322A; --ink: #1F1B18; --amber: #E8A33D;
  /* one sans stack for the whole UI, piece glyphs and the 楚河／漢界 words included */
  --font-body: "Noto Sans SC", "Noto Sans CJK SC", "Noto Sans", "PingFang SC", sans-serif;
  --scene-scale: 1;
  --scene-w: 1920px;
  --glass-radius: var(--sui-dim-radius-extra-huge, 32px);
  --lift: .28s cubic-bezier(.2,.8,.2,1);
}
/* ---------- skins ---------- */
#scene[data-skin="rosewood"], #room[data-skin="rosewood"] {
  --skin-board: #5A2E1E; --skin-board-2: #6A3826; --skin-grain: #3E1E12; --skin-line: #C9A24A; --skin-text: #C9A24A;
  --skin-ledge-1: #6E3A26; --skin-ledge-2: #4A2417; --skin-ledge-lip: #2E140C;
  --skin-piece-1: #F3E1BC; --skin-piece-2: #E4C99B; --skin-piece-3: #C7A46F; --skin-piece-edge: rgba(60,36,18,.45);
  --skin-glyph-r: #B8322A; --skin-glyph-b: #1F1B18;
  --skin-paper: 244, 236, 216; --skin-room-tint: transparent; }
#scene[data-skin="bamboo"], #room[data-skin="bamboo"] {
  --skin-board: #D8C79A; --skin-board-2: #E2D3A8; --skin-grain: #B9A776; --skin-line: #2F5D3A; --skin-text: #2F5D3A;
  --skin-ledge-1: #C9B47E; --skin-ledge-2: #A8935F; --skin-ledge-lip: #6E5D36;
  --skin-piece-1: #F3E1BC; --skin-piece-2: #E4C99B; --skin-piece-3: #C7A46F; --skin-piece-edge: rgba(60,50,18,.45);
  --skin-glyph-r: #B8322A; --skin-glyph-b: #1F1B18;
  --skin-paper: 238, 241, 221; --skin-room-tint: rgba(58, 112, 72, .22); }
#scene[data-skin="chuhan"], #room[data-skin="chuhan"] {
  --skin-board: #6B5340; --skin-board-2: #7A6049; --skin-grain: #4A3728; --skin-line: #2A2622; --skin-text: #2A2622;
  --skin-ledge-1: #5C4534; --skin-ledge-2: #3F2E22; --skin-ledge-lip: #241A13;
  --skin-piece-1: #B08A55; --skin-piece-2: #8C6B3F; --skin-piece-3: #6A4E2C; --skin-piece-edge: rgba(30,20,10,.55);
  --skin-glyph-r: #C93A2B; --skin-glyph-b: #14100D;
  --skin-paper: 230, 215, 188; --skin-room-tint: rgba(120, 80, 40, .14); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #221f1c; color: var(--sui-label-primary); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
sui-text { font-family: inherit; }

/* ---------- room (preview context only; not an app token) ---------- */
#room { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 15%, #5a4d42 0%, #3a332c 45%, #1f1b18 100%); }
#room .window-light { position: absolute; left: 6%; top: 8%; width: 20%; height: 46%; border-radius: 6px; background: linear-gradient(180deg, rgba(255,236,200,.12), rgba(255,236,200,.02)); box-shadow: 0 0 120px 40px rgba(255,230,190,.06); }
#room .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(180deg, #2b2521, #131110); box-shadow: 0 -40px 90px rgba(0,0,0,.4); }
#room .desk { display: none; position: absolute; left: 12%; right: 12%; top: 44%; bottom: 0; background: linear-gradient(180deg, #5e4b39 0%, #3b2e24 100%); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); box-shadow: 0 -30px 60px rgba(0,0,0,.35); }
#room[data-mode="table"] .desk { display: block; }
#room .tint { position: absolute; inset: 0; background: var(--skin-room-tint, transparent); pointer-events: none; }

/* ---------- glass ---------- */
.glass-regular {
  background: var(--Background-MaterialRegular, rgba(255,255,255,.34));
  -webkit-backdrop-filter: blur(50px) saturate(1.18); backdrop-filter: blur(50px) saturate(1.18);
  border-radius: var(--glass-radius);
  box-shadow: 0 18px 54px rgba(0,0,0,.24), inset 0 0 0 1px var(--sui-overlay-border, rgba(255,255,255,.28));
  color: var(--sui-label-primary);
}

/* ---------- scene ---------- */
#scene { position: absolute; left: 50%; top: 50%; width: var(--scene-w); height: var(--scene-h, 1250px); transform: translate(-50%, -50%) scale(var(--scene-scale)); transform-origin: 50% 50%; transition: opacity .4s ease; }
#scene.fading { opacity: 0; }
#scene[data-mode="wall"] { --scene-h: 1250px; --cell: 100px; }
#scene[data-mode="table"] { --scene-h: 1420px; --cell: 76px; }
.state { position: absolute; inset: 0; }

/* ---------- board state layout ---------- */
#state-board { display: flex; align-items: flex-start; justify-content: center; gap: 24px; padding: 16px 80px 8px 260px; --board-k: 1; --board-rot: 0deg; --board-fit: 1; --board-dy: 0px; --board-tilt: 0deg; }
#scene[data-mode="table"] #state-board { flex-direction: column; align-items: center; gap: 16px; padding: 16px 0 8px; }
#board-stage { position: relative; flex: 0 0 auto; }
#scene[data-mode="table"] #board-stage { perspective: 4000px; perspective-origin: 50% 0%; }
#board-wrap { position: relative; width: calc(var(--cell) * 9.4); zoom: var(--board-k); transform-origin: 50% 0; transform: translateY(var(--board-dy)); transition: transform .8s ease; }
#scene[data-mode="table"] #board-wrap { transform: translateY(var(--board-dy)) rotateX(calc(30deg - var(--board-tilt))); }
#board-svg { display: block; width: calc(var(--cell) * 9.4); height: calc(var(--cell) * 10); overflow: visible; font-family: var(--font-body);
  transform: rotate(var(--board-rot)) scale(var(--board-fit)); transform-origin: 50% 50%; transition: transform .5s ease; border-radius: 8px 8px 0 0; box-shadow: 0 24px 40px rgba(0,0,0,.45); }
#board-svg .river-text { font-family: var(--font-body); font-weight: 600; fill: var(--skin-text); }
#board-svg .glyph { font-family: var(--font-body); font-weight: 700; }
#board-svg .rail-label-text { font-family: var(--font-body); font-variant-numeric: tabular-nums; font-weight: 600; }
#board-svg .piece { cursor: pointer; transition: transform var(--lift); }
#board-svg .check-ring { animation: check-pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
#board-svg .err-flash { animation: err-flash .6s ease-out forwards; transform-box: fill-box; transform-origin: center; }
#board-svg .piece.bounce { animation: bounce .45s ease-out; }
#board-svg .ghost { pointer-events: none; }
#board-svg .hit { cursor: pointer; }
#state-board[data-phase="play-engine"] #board-svg .hit { cursor: not-allowed; }
/* eval rail (#tide) on the left frame: red rises from the bottom, black descends from the top */
#tide .rail-red, #tide .rail-black { transition: y .5s ease, height .5s ease; }
#tide[data-state="off"] { display: none; }
@keyframes check-pulse { 0%, 100% { stroke-opacity: .9; transform: scale(1); } 50% { stroke-opacity: .35; transform: scale(1.12); } }
@keyframes err-flash { 0% { opacity: .85; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes bounce { 0% { transform: translate(var(--tx), var(--ty)); } 35% { transform: translate(var(--tx), calc(var(--ty) - 22px)); } 70% { transform: translate(var(--tx), var(--ty)); } 85% { transform: translate(var(--tx), calc(var(--ty) - 6px)); } 100% { transform: translate(var(--tx), var(--ty)); } }

/* ---------- ledge ---------- */
#ledge { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: var(--cell); padding: 0 16px; border-radius: 0 0 10px 10px;
  background: linear-gradient(180deg, var(--skin-ledge-1) 0%, var(--skin-ledge-2) 100%); box-shadow: 0 18px 34px rgba(0,0,0,.45), inset 0 3px 0 rgba(255,255,255,.14), inset 0 -8px 0 var(--skin-ledge-lip); }
#ledge::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(180deg, rgba(0,0,0,.28), transparent); }
.tray { flex: 1 1 0; min-width: 120px; height: calc(var(--cell) * .58); display: flex; align-items: center; gap: 2px; padding: 0 10px; border-radius: 10px; background: rgba(0,0,0,.28); box-shadow: inset 0 3px 8px rgba(0,0,0,.45); overflow: hidden; }
.tray .cap { width: calc(var(--cell) * .32); height: calc(var(--cell) * .32); border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font-family: var(--font-body); font-weight: 700; font-size: calc(var(--cell) * .19); background: radial-gradient(circle at 35% 30%, var(--skin-piece-1), var(--skin-piece-2) 60%, var(--skin-piece-3)); box-shadow: 0 2px 3px rgba(0,0,0,.4); margin-left: calc(var(--cell) * -.06); }
.tray .cap:first-child { margin-left: 0; }
[data-material="jade"] .tray .cap { background: radial-gradient(circle at 35% 30%, #C9E0D0, var(--jade) 60%, #7FA58C); }
.tray .cap.side-r { color: var(--skin-glyph-r); } .tray .cap.side-b { color: var(--skin-glyph-b); }
.ledge-center { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; }
.ledge-buttons { display: flex; align-items: center; gap: 8px; }
.ledge-status { display: flex; align-items: center; gap: 8px; height: 22px; font-size: 15px; font-weight: 600; color: var(--sui-label-primary-light); text-shadow: 0 1px 2px rgba(0,0,0,.5); white-space: nowrap; }
.lamp { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.35); box-shadow: inset 0 1px 2px rgba(0,0,0,.6); transition: background .3s, box-shadow .3s; }
.lamp.on { background: var(--sui-alert); box-shadow: 0 0 12px 3px rgba(232,163,61,.75); animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 6px 1px rgba(232,163,61,.45); opacity: .7; } 50% { box-shadow: 0 0 16px 5px rgba(232,163,61,.9); opacity: 1; } }
.check-text { color: #FFD3CC; padding: 0 10px; border-radius: 12px; background: var(--cinnabar); }
.status-reason { color: #FFD9D9; }

/* ---------- piece box (editor) ---------- */
#piece-box { position: absolute; left: -176px; top: 0; width: 156px; min-height: 520px; padding: 14px 12px; border-radius: 14px; display: flex; gap: 8px; z-index: 2;
  background: linear-gradient(180deg, var(--skin-ledge-1), var(--skin-ledge-2)); box-shadow: 0 18px 34px rgba(0,0,0,.45), inset 0 0 0 4px rgba(0,0,0,.25); }
#scene[data-mode="table"] #piece-box { left: -200px; }
.pb-col { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.pb-slot { position: relative; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-family: var(--font-body); font-weight: 700; font-size: 28px;
  background: radial-gradient(circle at 35% 30%, var(--skin-piece-1), var(--skin-piece-2) 60%, var(--skin-piece-3)); box-shadow: 0 3px 5px rgba(0,0,0,.45), inset 0 0 0 2px rgba(0,0,0,.08); transition: transform var(--lift), box-shadow var(--lift); }
[data-material="jade"] .pb-slot { background: radial-gradient(circle at 35% 30%, #C9E0D0, var(--jade) 60%, #7FA58C); }
.pb-slot.side-r { color: var(--skin-glyph-r); } .pb-slot.side-b { color: var(--skin-glyph-b); }
.pb-slot.empty { opacity: .3; cursor: default; }
.pb-slot.brush { transform: translateY(-4px); box-shadow: 0 8px 14px rgba(0,0,0,.5), 0 0 0 4px var(--amber); }
.pb-slot .count { position: absolute; right: -4px; bottom: -2px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink); color: #F4ECD8; font: 600 12px/20px var(--font-body); text-align: center; }

/* ---------- score scroll ---------- */
#scroll { position: relative; display: flex; flex-direction: column; overflow: hidden; flex: 1 1 auto; min-width: 480px; max-width: 800px; height: min(1280px, calc(var(--cell) * 11)); }
#scene[data-mode="table"] #scroll { order: -1; flex: 0 0 auto; width: clamp(960px, calc(100% - 640px), 1600px); max-width: none; height: 420px; }
#scroll-title { flex: 0 0 auto; }
#scroll-title-text { font-family: var(--font-body); font-size: 26px; }
.scroll-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 24px 24px; }
#scene[data-mode="table"] .scroll-body { padding: 0 24px 16px; }
.paper { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; border-radius: 20px; overflow: hidden;
  background: rgba(var(--skin-paper), .85); color: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(60,40,20,.16), inset 0 0 60px rgba(60,40,20,.08);
  /* ink-on-paper tone for the adaptive roles inside this inner card (README: --sui-* overrides on an ancestor) */
  --sui-label-primary: #1F1B18; --sui-label-secondary: rgba(31,27,24,.82); --sui-label-tertiary: rgba(31,27,24,.66); --sui-label-quaternary: rgba(31,27,24,.42);
  --sui-fill-secondary: rgba(31,27,24,.16); --sui-fill-tertiary: rgba(31,27,24,.07); --sui-fill-light: rgba(31,27,24,.06);
  --sui-lighten-hover: rgba(31,27,24,.06); --sui-lighten-pressed: rgba(31,27,24,.12); --sui-divider-line: rgba(31,27,24,.16); }
#scene[data-mode="table"] .paper { flex-direction: row; gap: 20px; padding: 12px 16px; }
.paper > section { display: none; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; flex: 0 0 auto; }
#scene[data-mode="table"] .paper > section { gap: 6px; }
#state-board[data-phase="ready"] .phase-ready,
#state-board[data-phase="play-me"] .phase-play, #state-board[data-phase="play-engine"] .phase-play,
#state-board[data-phase="review"] .phase-review, #state-board[data-phase="result"] .phase-review, #state-board[data-phase="editor"] .phase-editor { display: flex; }
#state-board[data-phase="play-me"] .review-only, #state-board[data-phase="play-engine"] .review-only { display: none !important; }
#move-section { flex: 1 1 0; min-height: 180px; }
#scene[data-mode="table"] #move-section { flex: 1.25 1 0; }
#scene[data-mode="table"] #engine-block { flex: 1 1 0; }
#scene[data-mode="table"] #annot-block { flex: .95 1 0; }
.scroll-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.review-actions { display: flex; gap: 8px; }
.mv-head { display: grid; grid-template-columns: 56px 1fr 1fr; padding: 0 12px 0 16px; font-size: 14px; font-weight: 600; color: var(--sui-label-tertiary); }
.mv-head span:nth-child(2) { color: var(--cinnabar); }
#move-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 4px; padding: 4px 2px 8px; scrollbar-width: thin; }
#scene[data-mode="table"] #move-list { display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, max-content); grid-auto-columns: 360px; gap: 4px 10px; overflow: auto; padding: 2px 2px 6px; scroll-snap-type: x mandatory; }
#scene[data-mode="table"] #move-list > sui-list-item { scroll-snap-align: start; }
.mv-empty { padding: 24px 12px; text-align: center; color: var(--sui-label-tertiary); font-size: 16px; }
sui-list-item.mv-row { border-radius: 16px; transition: transform var(--lift), box-shadow var(--lift); }
sui-list-item.mv-row.cur { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(31,27,24,.22); }
sui-list-item.mv-var { margin-left: 32px; }
.mv-line { display: grid; grid-template-columns: 56px 1fr 1fr; align-items: center; gap: 4px; font-family: var(--font-body); font-size: 24px; line-height: 30px; font-variant-numeric: tabular-nums; }
#scene[data-mode="table"] .mv-line { font-size: 20px; line-height: 26px; }
.mv-no { font-family: var(--font-body); font-size: 15px; color: var(--sui-label-tertiary); }
.mv-cell { position: relative; padding: 0 10px; border-radius: 10px; cursor: pointer; white-space: nowrap; min-height: 30px; }
.mv-cell:hover { background: rgba(31,27,24,.06); }
.mv-cell.red { color: var(--cinnabar); } .mv-cell.black { color: var(--ink); }
.mv-cell.cur { background: rgba(232,163,61,.22); box-shadow: inset 4px 0 0 var(--amber); }
.mv-cell .nag { font-family: var(--font-body); font-size: .75em; margin-left: 2px; color: var(--sui-label-secondary); }
.mv-var-line { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-family: var(--font-body); font-size: 20px; line-height: 26px; color: var(--sui-label-secondary); }
.mv-var-line .mv-cell { font-size: 20px; min-height: 26px; }
.mv-var-line .arrow { font-family: var(--font-body); color: var(--sui-label-tertiary); font-size: 14px; margin-right: 4px; }
.mv-comment { grid-column: 1 / -1; font-family: var(--font-body); font-size: 14px; line-height: 20px; color: var(--sui-label-secondary); padding: 2px 10px 0; white-space: normal; }

/* engine block */
#engine-block { border-top: 1px solid var(--sui-divider-line); padding-top: 10px; }
#scene[data-mode="table"] #engine-block { border-top: 0; border-left: 1px solid var(--sui-divider-line); padding: 0 0 0 20px; }
.eng-head { display: flex; align-items: center; gap: 10px; }
.eng-head .grow { flex: 1; }
.eng-score { font-variant-numeric: tabular-nums; font-weight: 700; }
.eng-state { display: none; align-items: center; gap: 10px; }
#engine-block[data-state="off"] .eng-off, #engine-block[data-state="thinking"] .eng-thinking, #engine-block[data-state="ready"] .eng-ready,
#engine-block[data-state="unavailable"] .eng-unavailable, #engine-block[data-state="error"] .eng-error { display: flex; }
.eng-thinking { flex-direction: column; align-items: stretch; }
.eng-msg { display: flex; flex-direction: column; gap: 2px; flex: 1; }
#engine-lines { flex-direction: column; gap: 6px; }
#engine-lines sui-list-item { font-family: var(--font-body); }

/* annotation block */
#annot-block { border-top: 1px solid var(--sui-divider-line); padding-top: 10px; }
#scene[data-mode="table"] #annot-block { border-top: 0; border-left: 1px solid var(--sui-divider-line); padding: 0 0 0 20px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
#nag-chips sui-toggleable-chip { font-family: var(--font-body); font-weight: 700; }
#note-area { width: 100%; }

/* ready & editor panels */
#ready-panel, #editor-panel { gap: 14px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.form-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.form-row > sui-text:first-child { min-width: 96px; }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px; font-size: 15px; font-weight: 600; }
.badge.ok { background: rgba(62,155,106,.16); color: #2C7B52; } .badge.bad { background: rgba(214,69,69,.14); color: #B93B3B; }
.hint { font-size: 14px; line-height: 20px; color: var(--sui-label-tertiary); }

/* ---------- toolbar (sui-toolbar) content ---------- */
.tb-lead { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; margin-right: 4px; border-right: 1px solid var(--sui-divider-line); }
.turn-disc { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-body); font-weight: 700; font-size: 20px; background: radial-gradient(circle at 35% 30%, #F3E1BC, #E4C99B 60%, #C7A46F); box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.turn-disc.side-r { color: var(--cinnabar); } .turn-disc.side-b { color: var(--ink); }
.tb-turn-text { display: flex; flex-direction: column; line-height: 1.05; min-width: 72px; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------- sheets (placement & display, help) ---------- */
.sheet-form { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.sheet-form .form-row > sui-text:first-child { min-width: 88px; }
#tilt-row[data-disabled="true"] { opacity: .45; pointer-events: none; }
.help-steps { list-style: none; margin: 0; padding: 4px 0 0; display: flex; flex-direction: column; gap: 14px; }
.help-steps li { display: flex; align-items: flex-start; gap: 14px; font-size: 16px; line-height: 24px; color: var(--sui-label-primary); }
.help-steps .step-no { font-family: var(--font-body); font-size: 26px; line-height: 26px; font-weight: 700; color: var(--amber); min-width: 40px; }

/* ---------- box (棋箱) ---------- */
#box-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: clamp(960px, 67%, 1600px); height: clamp(540px, 60%, 900px); display: flex; flex-direction: column; overflow: hidden; z-index: 5; }
#box-title { flex: 0 0 auto; }
.box-body { flex: 1; min-height: 0; display: flex; gap: 24px; padding: 0 24px 24px; }
#box-nav { flex: 0 0 240px; }
.box-content { flex: 1; min-width: 0; overflow: auto; padding: 4px 8px 8px 4px; }
.box-section { display: flex; flex-direction: column; gap: 16px; }
#library-list { display: flex; flex-direction: column; gap: 8px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 48px 24px; text-align: center; }
.empty .big { font-size: 44px; opacity: .6; }
.opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
.settings-grid { display: grid; grid-template-columns: 200px 1fr; row-gap: 20px; column-gap: 24px; align-items: center; }
.settings-grid .ctl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.io-col { display: flex; flex-direction: column; gap: 10px; }
.io-col sui-text-area { width: 100%; }
.io-col .code { font-family: var(--font-body); font-variant-numeric: tabular-nums; font-size: 13px; line-height: 18px; white-space: pre-wrap; word-break: break-all; padding: 12px; border-radius: 12px; background: var(--sui-fill-tertiary); max-height: 300px; overflow: auto; }

/* ---------- result sheet content ---------- */
.result-body { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 0; text-align: center; }
.result-icon { font-size: 56px; line-height: 1; margin-bottom: 8px; }
.result-main { font-family: var(--font-body); font-size: 40px; line-height: 48px; font-weight: 700; color: var(--sui-label-primary); }
.result-main.side-r { color: #E2695B; } .result-main.side-b { color: var(--sui-label-primary); }
.result-sub { font-size: 20px; color: var(--sui-label-secondary); }
.result-reason { font-size: 16px; color: var(--sui-label-secondary); margin-top: 6px; }
.result-plies { font-size: 14px; color: var(--sui-label-tertiary); }

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .lamp.on, #board-svg .check-ring { animation: none !important; }
  #scene, #board-wrap, #board-svg, sui-list-item.mv-row, .pb-slot, #board-svg .piece, #tide .rail-red, #tide .rail-black { transition: none !important; }
  sui-list-item.mv-row.cur { transform: none; box-shadow: inset 0 0 0 2px var(--amber); }
  #board-svg .piece.bounce { animation: none; }
}

</style>
</head>
<body>
<!-- Room: preview context only (shows glass translucency); not an app token. -->
<div id="room" data-mode="wall" data-skin="rosewood"><div class="window-light"></div><div class="desk"></div><div class="floor"></div><div class="tint"></div></div>

<div id="scene" data-mode="wall" data-skin="rosewood">

  <!-- ================= #2–#6 Board states ================= -->
  <section id="state-board" class="state" data-phase="ready" data-mode="wall" data-material="wood">
    <div id="board-stage">
      <div id="board-wrap">
        <!-- viewBox starts at x=-40: the 40-unit left frame carries the eval rail (#tide) outside the playing grid -->
        <svg id="board-svg" viewBox="-40 0 940 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="棋盘 board"></svg>
        <!-- #23 Ledge -->
        <div id="ledge">
          <div id="tray-red" class="tray" aria-label="red captured"></div>
          <div class="ledge-center">
            <div class="ledge-buttons">
              <sui-icon-button id="lb-back" icon="◀" size="regular"></sui-icon-button>
              <sui-icon-button id="lb-fwd" icon="▶" size="regular"></sui-icon-button>
              <sui-icon-button id="lb-takeback" size="regular"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></sui-icon-button>
              <sui-icon-button id="lb-hint" icon="💡" size="regular"></sui-icon-button>
              <sui-toggle-button id="lb-mode" size="small" text="壁挂／桌面" data-i18n-attr="text:ledge.mode"></sui-toggle-button>
            </div>
            <div class="ledge-status"><span id="lamp" class="lamp"></span><span id="ledge-text"></span><span id="check-text" class="check-text" hidden></span><span id="ledge-reason" class="status-reason" hidden></span></div>
          </div>
          <div id="tray-black" class="tray" aria-label="black captured"></div>
        </div>
      </div>
      <!-- #27 Piece box -->
      <div id="piece-box" hidden><div class="pb-col side-r" data-side="r"></div><div class="pb-col side-b" data-side="b"></div></div>
    </div>

    <!-- #24 Score scroll -->
    <aside id="scroll" class="glass-regular">
      <sui-title-bar id="scroll-title" width="592">
        <span slot="title" id="scroll-title-text"></span>
        <sui-segment-control slot="trailing" id="seg-lang" options="中文,EN" selected-index="0" size="small"></sui-segment-control>
      </sui-title-bar>
      <div class="scroll-body">
        <div class="paper">
          <section id="ready-panel" class="phase-ready">
            <sui-text variant="headlineMedium" data-i18n="sc.readyTitle"></sui-text>
            <sui-text id="ready-summary" variant="bodyLarge"></sui-text>
            <sui-text variant="bodyMedium" class="hint" data-i18n="sc.readyHint"></sui-text>
            <div class="btn-row">
              <sui-button id="btn-ready-review" data-i18n-attr="text:sc.review" text="复盘"></sui-button>
              <sui-button id="btn-ready-new" data-i18n-attr="text:sc.newGame" text="新局"></sui-button>
              <sui-button id="btn-ready-edit" data-i18n-attr="text:sc.edit" text="摆局"></sui-button>
              <sui-button id="btn-ready-box" data-i18n-attr="text:sc.openBox" text="打开棋箱"></sui-button>
            </div>
          </section>

          <section id="editor-panel" class="phase-editor">
            <sui-text variant="headlineMedium" data-i18n="sc.editor.title"></sui-text>
            <div class="form-row"><sui-text variant="labelLarge" data-i18n="sc.editor.side"></sui-text><sui-segment-control id="seg-editor-side" data-i18n-attr="options:sc.editor.side.options" options="红先,黑先" selected-index="0" size="regular"></sui-segment-control></div>
            <div class="btn-row">
              <sui-button id="btn-ed-clear" size="small" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:sc.editor.clear" text="清空"></sui-button>
              <sui-button id="btn-ed-start" size="small" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:sc.editor.start" text="初始"></sui-button>
              <sui-button id="btn-ed-flip" size="small" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:sc.editor.flip" text="翻转"></sui-button>
            </div>
            <div id="ed-brush" class="hint"></div>
            <div id="ed-valid" class="badge ok"><span id="ed-valid-icon">✓</span><span id="ed-valid-text"></span></div>
            <sui-text variant="bodyMedium" class="hint" data-i18n="sc.editor.hint"></sui-text>
            <div class="btn-row">
              <sui-button id="btn-ed-done" data-i18n-attr="text:sc.editor.done" text="完成"></sui-button>
              <sui-button id="btn-ed-cancel" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:sc.editor.cancel" text="取消"></sui-button>
            </div>
          </section>

          <section id="move-section" class="phase-play phase-review">
            <div class="scroll-tools">
              <sui-segment-control id="seg-notation" options="中文,WXF,ICCS" selected-index="0" size="regular"></sui-segment-control>
              <div class="review-actions review-only">
                <sui-button id="btn-play-here" size="small" data-i18n-attr="text:sc.playFromHere" text="从此局面对弈"></sui-button>
                <sui-button id="btn-edit" size="small" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:sc.edit" text="摆局"></sui-button>
              </div>
            </div>
            <div class="mv-head"><span data-i18n="sc.round"></span><span data-i18n="sc.red"></span><span data-i18n="sc.black"></span></div>
            <!-- #30 move list binding -->
            <div id="move-list"></div>
          </section>

          <!-- #25 / #31 Engine block -->
          <section id="engine-block" class="phase-play phase-review" data-state="ready">
            <div class="eng-head">
              <sui-switch id="sw-engine" checked></sui-switch>
              <sui-text variant="titleMedium" data-i18n="sc.engine"></sui-text>
              <sui-text id="eng-depth" variant="labelLarge" color="var(--sui-label-tertiary)" class="grow"></sui-text>
              <sui-text id="eng-score" variant="titleMedium" class="eng-score"></sui-text>
            </div>
            <div class="eng-state eng-off"><sui-text variant="bodyMedium" color="var(--sui-label-tertiary)" data-i18n="sc.engineOff"></sui-text></div>
            <div class="eng-state eng-thinking"><sui-linear-progress indeterminate size="small"></sui-linear-progress><sui-text variant="bodyMedium" color="var(--sui-label-tertiary)" data-i18n="sc.engineThinking"></sui-text></div>
            <div class="eng-state eng-unavailable"><sui-icon glyph="⚠" tint="var(--sui-alert)"></sui-icon><div class="eng-msg"><sui-text variant="titleSmall" data-i18n="sc.engineUnavailable"></sui-text><sui-text variant="bodySmall" color="var(--sui-label-tertiary)" data-i18n="sc.engineUnavailableHint"></sui-text></div></div>
            <div class="eng-state eng-error"><sui-icon glyph="✕" tint="var(--sui-error)"></sui-icon><div class="eng-msg"><sui-text variant="titleSmall" color="var(--sui-error)" data-i18n="sc.engineError"></sui-text><sui-text variant="bodySmall" color="var(--sui-label-tertiary)" data-i18n="sc.engineErrorHint"></sui-text></div><sui-button id="btn-eng-retry" size="min" data-i18n-attr="text:sc.retry" text="重试"></sui-button></div>
            <div id="engine-lines" class="eng-state eng-ready"></div>
          </section>

          <section id="annot-block" class="phase-review">
            <sui-text variant="titleSmall" data-i18n="sc.annot"></sui-text>
            <div class="chip-row" id="nag-chips">
              <sui-toggleable-chip data-nag="!" label="!" size="small">!</sui-toggleable-chip>
              <sui-toggleable-chip data-nag="?" label="?" size="small">?</sui-toggleable-chip>
              <sui-toggleable-chip data-nag="!!" label="!!" size="small">!!</sui-toggleable-chip>
              <sui-toggleable-chip data-nag="??" label="??" size="small">??</sui-toggleable-chip>
              <sui-toggleable-chip data-nag="±" label="±" size="small">±</sui-toggleable-chip>
              <sui-toggleable-chip data-nag="=" label="=" size="small">=</sui-toggleable-chip>
            </div>
            <div class="chip-row" id="phrase-chips">
              <sui-button-chip data-phrase="good" size="small" data-i18n="sc.phrase.good" label="好棋">好棋</sui-button-chip>
              <sui-button-chip data-phrase="mistake" size="small" data-i18n="sc.phrase.mistake" label="失误">失误</sui-button-chip>
              <sui-button-chip data-phrase="critical" size="small" data-i18n="sc.phrase.critical" label="关键局面">关键局面</sui-button-chip>
            </div>
            <sui-text-area id="note-area" width="520" data-i18n-attr="placeholder:sc.notePlaceholder" placeholder="添加批注…"></sui-text-area>
          </section>
        </div>
      </div>
    </aside>
  </section>

  <!-- ================= #8 / #28 Box overlay ================= -->
  <section id="box-panel" class="glass-regular" hidden>
    <sui-title-bar id="box-title" width="1232">
      <span slot="title" data-i18n="box.title"></span>
      <sui-icon-button slot="trailing" id="btn-box-close" icon="✕" size="regular"></sui-icon-button>
    </sui-title-bar>
    <div class="box-body">
      <sui-side-navigation id="box-nav" data-i18n-attr="items:box.nav.items" items="棋谱库,新局,导入导出,设置" selected-index="0"></sui-side-navigation>
      <div class="box-content">
        <!-- Library -->
        <div id="box-library" class="box-section">
          <sui-search-field id="lib-search" width="420" data-i18n-attr="placeholder:box.lib.search" placeholder="搜索棋谱"></sui-search-field>
          <div id="library-list"></div>
          <div id="library-empty" class="empty" hidden><div class="big">📜</div><sui-text variant="titleMedium" data-i18n="box.lib.empty"></sui-text><sui-text variant="bodyMedium" color="var(--sui-label-tertiary)" data-i18n="box.lib.emptyHint"></sui-text></div>
        </div>
        <!-- New game -->
        <div id="box-new" class="box-section" hidden>
          <sui-text variant="titleMedium" data-i18n="box.new.side"></sui-text>
          <div class="opt-row" id="side-options">
            <sui-option data-side="r" icon="帥" data-i18n-attr="label:box.new.red" label="红方" checked></sui-option>
            <sui-option data-side="b" icon="將" data-i18n-attr="label:box.new.black" label="黑方"></sui-option>
            <sui-option data-side="random" icon="⚄" data-i18n-attr="label:box.new.random" label="随机"></sui-option>
          </div>
          <sui-text variant="titleMedium" data-i18n="box.new.level"></sui-text>
          <sui-segment-control id="seg-level" data-i18n-attr="options:box.new.level.options" options="入门,初级,中级,高级,大师" selected-index="2" size="regular"></sui-segment-control>
          <sui-text variant="titleMedium" data-i18n="box.new.clock"></sui-text>
          <sui-segment-control id="seg-clock" data-i18n-attr="options:box.new.clock.options" options="不限时,5 分钟,10 分钟,30 分钟" selected-index="0" size="regular"></sui-segment-control>
          <div class="btn-row"><sui-button id="btn-start" size="max" data-i18n-attr="text:box.new.start" text="开始对局"></sui-button></div>
        </div>
        <!-- Import / Export -->
        <div id="box-io" class="box-section" hidden>
          <div class="io-grid">
            <div class="io-col">
              <sui-text variant="titleMedium" data-i18n="box.io.title"></sui-text>
              <sui-text-area id="import-area" width="480" data-i18n-attr="placeholder:box.io.placeholder" placeholder="粘贴 PGN、FEN 或着法列表"></sui-text-area>
              <div class="btn-row"><sui-button id="btn-import" data-i18n-attr="text:box.io.import" text="导入"></sui-button><sui-button id="btn-import-clear" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:sc.editor.clear" text="清空"></sui-button></div>
            </div>
            <div class="io-col">
              <sui-text variant="titleMedium" data-i18n="box.io.export"></sui-text>
              <div id="export-code" class="code"></div>
              <div class="btn-row"><sui-button id="btn-export" data-i18n-attr="text:box.io.export" text="导出"></sui-button><sui-button id="btn-copy" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:box.io.copy" text="复制"></sui-button></div>
            </div>
          </div>
        </div>
        <!-- Settings (#34) -->
        <div id="box-settings" class="box-section" hidden>
          <div id="settings-form" class="settings-grid">
            <sui-text variant="titleMedium" data-i18n="box.set.lang"></sui-text><div class="ctl"><sui-segment-control id="seg-set-lang" options="中文,English" selected-index="0" size="regular"></sui-segment-control></div>
            <sui-text variant="titleMedium" data-i18n="box.set.notation"></sui-text><div class="ctl"><sui-segment-control id="seg-set-notation" options="中文,WXF,ICCS" selected-index="0" size="regular"></sui-segment-control></div>
            <sui-text variant="titleMedium" data-i18n="box.set.face"></sui-text><div class="ctl"><sui-segment-control id="seg-set-face" data-i18n-attr="options:box.set.face.options" options="跟随语言,汉字,字母" selected-index="0" size="regular"></sui-segment-control></div>
            <sui-text variant="titleMedium" data-i18n="box.set.skin"></sui-text><div class="ctl"><sui-segment-control id="seg-set-skin" data-i18n-attr="options:box.set.skin.options" options="紫檀,竹林,楚汉烽烟" selected-index="0" size="regular"></sui-segment-control></div>
            <sui-text variant="titleMedium" data-i18n="box.set.material"></sui-text><div class="ctl"><sui-segment-control id="seg-set-material" data-i18n-attr="options:box.set.material.options" options="黄杨,玉" selected-index="0" size="regular"></sui-segment-control></div>
            <sui-text variant="titleMedium" data-i18n="box.set.sounds"></sui-text><div class="ctl"><sui-switch id="sw-sounds" checked></sui-switch></div>
            <sui-text variant="titleMedium" data-i18n="box.set.haptics"></sui-text><div class="ctl"><sui-switch id="sw-haptics" checked></sui-switch></div>
            <sui-text variant="titleMedium" data-i18n="box.set.placement"></sui-text><div class="ctl"><sui-button id="btn-placement" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:box.set.placementBtn" text="摆放与显示…"></sui-button><sui-text variant="bodyMedium" color="var(--sui-label-tertiary)" data-i18n="pl.note"></sui-text></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- #26 Toolbar (replaces the wrist bracelet): docked 16 dp below the ledge (wall) / in front of the near edge (table) -->
<sui-toolbar id="toolbar" for="board-wrap" corner-radius="32" offset-y="96">
  <div class="tb-lead">
    <span id="br-turn-disc" class="turn-disc side-r">帥</span>
    <div class="tb-turn-text"><sui-text id="br-turn-label" variant="labelMedium" color="var(--sui-label-secondary)"></sui-text><sui-text id="br-clock" variant="titleMedium" class="mono"></sui-text></div>
    <sui-chip id="br-state" size="small" label="壁挂模式"></sui-chip>
  </div>
  <sui-icon-button id="br-hint" icon="💡" size="regular"></sui-icon-button>
  <sui-icon-button id="br-takeback" size="regular"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></sui-icon-button>
  <sui-toggle-button id="br-mode" size="small" text="壁挂／桌面" data-i18n-attr="text:ledge.mode"></sui-toggle-button>
  <sui-icon-button id="br-engine" icon="⚙" size="regular" toggle selected></sui-icon-button>
  <sui-icon-button id="br-box" icon="▦" size="regular"></sui-icon-button>
  <sui-icon-button id="br-resign" icon="🏳" size="regular"></sui-icon-button>
  <sui-icon-button id="br-more" icon="⋯" size="regular"></sui-icon-button>
</sui-toolbar>
<!-- offset-y lifts the menu above the ⋯ button (two 48 dp items + paddings = 116, + anchor 48 + 8 gap) -->
<sui-menu id="toolbar-menu" for="br-more" offset-y="-172" hidden>
  <sui-menu-item value="placement" leading-icon="⊞" data-i18n-attr="title:pl.title" title="摆放与显示"></sui-menu-item>
  <sui-menu-item value="help" leading-icon="?" data-i18n-attr="title:help.title" title="使用帮助"></sui-menu-item>
</sui-menu>

<!-- #1 Placement & display sheet (no plane wizard: the board window is placed with the system window handle) -->
<div id="state-placement" data-open="false">
  <sui-sheet id="placement-sheet" hidden dismiss-on-click-outside dismiss-on-escape corner-radius="32">
    <span slot="title" data-i18n="pl.title"></span>
    <div class="sheet-form">
      <div class="form-row"><sui-text variant="labelLarge" data-i18n="pl.mode" color="var(--sui-label-primary)"></sui-text><sui-segment-control id="seg-place-mode" data-i18n-attr="options:pl.mode.options" options="壁挂,桌面" selected-index="0" size="regular"></sui-segment-control></div>
      <div class="form-row"><sui-text variant="labelLarge" data-i18n="pl.size" color="var(--sui-label-primary)"></sui-text><sui-slider id="sl-size" min="80" max="140" value="100" width="220" size="small"></sui-slider><sui-text id="sl-size-val" variant="labelLarge" class="mono" color="var(--sui-label-primary)"></sui-text></div>
      <div class="form-row"><sui-text variant="labelLarge" data-i18n="pl.orient" color="var(--sui-label-primary)"></sui-text><sui-segment-control id="seg-orient" options="0°,90°,180°,270°" selected-index="0" size="regular"></sui-segment-control></div>
      <div class="form-row"><sui-text variant="labelLarge" data-i18n="pl.height" color="var(--sui-label-primary)"></sui-text><sui-stepper id="st-height" value="0 cm" step="1"></sui-stepper></div>
      <div class="form-row" id="tilt-row"><sui-text variant="labelLarge" data-i18n="pl.tilt" color="var(--sui-label-primary)"></sui-text><sui-slider id="sl-tilt" min="0" max="20" value="0" width="220" size="small"></sui-slider><sui-text id="sl-tilt-val" variant="labelLarge" class="mono" color="var(--sui-label-primary)"></sui-text></div>
      <sui-text variant="bodySmall" color="var(--sui-label-secondary)" data-i18n="pl.note"></sui-text>
    </div>
    <div slot="bottom" class="btn-row">
      <sui-button id="btn-place-done" data-i18n-attr="text:pl.done" text="完成"></sui-button>
      <sui-button id="btn-replace" container-color="var(--sui-fill-secondary)" content-color="var(--sui-label-primary)" data-i18n-attr="text:pl.reset" text="重置摆放"></sui-button>
    </div>
  </sui-sheet>
</div>

<!-- First-launch help -->
<sui-sheet id="help-sheet" hidden dismiss-on-click-outside dismiss-on-escape corner-radius="32">
  <span slot="title" data-i18n="help.title"></span>
  <ol class="help-steps">
    <li><span class="step-no">01</span><span data-i18n="help.s1"></span></li>
    <li><span class="step-no">02</span><span data-i18n="help.s2"></span></li>
    <li><span class="step-no">03</span><span data-i18n="help.s3"></span></li>
  </ol>
  <div slot="bottom" class="btn-row"><sui-button id="btn-help-start" size="max" data-i18n-attr="text:help.start" text="开始"></sui-button></div>
</sui-sheet>

<!-- #11 #14 #17 #18 Confirmations -->
<sui-alert-dialog id="dlg-overwrite" hidden>

/** Convert a Compose 0xAARRGGBB int-literal into a CSS rgba() string. */

  const g = (v >>> 8) & 0xff;
  const b = v & 0xff;
  return `rgba(${r}, ${g}, ${b}, ${+a.toFixed(4)})`;

  FillDarkerAlpha: argb(0xff282828),
  FillLightAlpha: argb(0x26ffffff),
  FillNeutralAlpha: argb(0x0a000000),
  FillPrimary: argb(0xff282828),
  FillSecondaryAlpha: argb(0x66ffffff),
  FillSemilightAlpha: argb(0x66ffffff),
  FillTertiaryAlpha: argb(0x0a000000),
  LabelDarkAlpha: argb(0x66000000),
  LabelDarkestAlpha: argb(0xff000000),
  LabelLightAlpha: argb(0x66ffffff),

  LabelPrimaryLight: argb(0xffffffff),

  LabelTertiaryAlpha: argb(0x80000000),
  LabelUltradarkAlpha: argb(0xcc000000),
  LineDividerLine: argb(0x1f808080),

  SubGray100: argb(0xff333333),
  SubGreen100: argb(0xffb3ff66),
  SubOrange100: argb(0xffffbf00),
  SubRed100: argb(0xffff4d4d),
  SubWhite100: argb(0xffffffff),
  SubWhite40: argb(0x66ffffff),
  SubWhite60: argb(0x99ffffff),

 * Every value is a CSS color string. Consumers can pass a partial override

  "fillSecondary",
  "fillTertiary",
  "fillLight",
  "labelPrimaryLight",
  "labelPrimary",
  "labelSecondary",
  "labelTertiary",
  "labelQuaternary",
  "lightenHover",
  "lightenPressed",
  "error",
  "alert",
  "passable",
  "interaction",
  "dividerLine",

  const out = { ...base };
  if (overrides) for (const k of Object.keys(overrides)) if (overrides[k] != null) out[k] = overrides[k];

 * Default (non-vibrant / solid) color scheme.

 * fully specified; this is the "flat / non-glass" fallback.

    {
      fillPrimary: ColorTokens.FillDarkerAlpha, // 0xFF282828
      fillSecondary: ColorTokens.FillSemilightAlpha, // 0x66FFFFFF
      fillTertiary: ColorTokens.FillNeutralAlpha, // 0x0A000000
      fillLight: ColorTokens.FillLightAlpha, // 0x26FFFFFF
      labelPrimaryLight: ColorTokens.SubWhite100, // 0xFFFFFFFF
      labelPrimary: ColorTokens.LabelDarkestAlpha, // 0xFF000000
      labelSecondary: ColorTokens.LabelUltradarkAlpha, // 0xCC000000
      labelTertiary: ColorTokens.LabelSemidarkAlpha, // 0xA6000000
      labelQuaternary: ColorTokens.LabelDarkAlpha, // 0x66000000
      lightenHover: ColorTokens.FillSemilightAlpha,
      lightenPressed: ColorTokens.FillSemilightAlpha,
      error: ColorTokens.SubRed100,
      alert: ColorTokens.SubOrange100,
      passable: ColorTokens.SubGreen100,
      interaction: ColorTokens.SubBlue100,
      dividerLine: ColorTokens.SubBlack12,

 * Vibrant (glass / material) color scheme.
 * Mirrors vibrantColorScheme() in ColorScheme.kt. On Android Vibrant.* colors

 * Color values mirror the Compose source:
 *   fillPrimary        = Vibrant.Darker     ≈ 0xE6101010 (deep glass)
 *   fillSecondary      = Vibrant.SemiLight  ≈ 0x66FFFFFF (mid glass)

      fillSecondary: "rgba(255, 255, 255, 0.40)", // Vibrant.SemiLight
      fillTertiary: "rgba(255, 255, 255, 0.08)",  // Vibrant.Neutral
      fillLight: "rgba(255, 255, 255, 0.15)",     // Vibrant.Light
      labelPrimaryLight: ColorTokens.SubWhite100,
      labelPrimary: "rgba(255, 255, 255, 0.94)",  // Vibrant.Darkest
      labelSecondary: "rgba(255, 255, 255, 0.80)", // Vibrant.UltraDark
      labelTertiary: "rgba(255, 255, 255, 0.65)", // Vibrant.Semidark
      labelQuaternary: "rgba(255, 255, 255, 0.40)", // Vibrant.Dark
      lightenHover: "rgba(255, 255, 255, 0.20)",
      lightenPressed: "rgba(255, 255, 255, 0.30)",
      error: "rgba(255, 77, 77, 1)",
      alert: "rgba(255, 191, 0, 1)",
      passable: "rgba(179, 255, 102, 1)",
      interaction: "rgba(51, 119, 255, 1)",
      dividerLine: "rgba(255, 255, 255, 0.12)",

  GapMedium: 12,
  GapSmall: 8,

  PaddingMedium: 24,

  WidthExtraLarge: 480,
  WidthHuge: 600,
  WidthLarge: 400,
  WidthMedium: 360,
  WidthMin: 160,
  WidthRegular: 320,

  displayLarge: { size: 40, line: 54, weight: 700 },
  displayMedium: { size: 32, line: 40, weight: 700 },
  displaySmall: { size: 28, line: 34, weight: 700 },
  headlineLarge: { size: 24, line: 30, weight: 700 },
  headlineMedium: { size: 20, line: 26, weight: 700 },
  headlineSmall: { size: 16, line: 20, weight: 700 },
  titleLarge: { size: 20, line: 26, weight: 600 },
  titleMedium: { size: 16, line: 20, weight: 600 },
  titleSmall: { size: 14, line: 18, weight: 600 },
  bodyLarge: { size: 16, line: 20, weight: 500 },
  bodyLargeMultiline: { size: 16, line: 24, weight: 500 },
  bodyMedium: { size: 14, line: 18, weight: 500 },
  bodyMediumMultiline: { size: 14, line: 22, weight: 500 },
  bodySmall: { size: 12, line: 16, weight: 500 },
  bodyTiny: { size: 10, line: 12, weight: 500 },

/**

 * target element. Mirrors what PicoTheme() {} Composable does via
 * CompositionLocalProvider — any subtree under `target` will read these vars.

  const cs = scheme || _activeScheme;
  const set = (k, v) => target.style.setProperty(k, v);
  for (const k of COLOR_SCHEME_KEYS) set(`--sui-${kebab(k)}`, cs[k]);

function kebab(camel) {
  return camel.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase());

 *   PicoTheme.colorScheme       -> current default ColorScheme (object)
 *   PicoTheme.install(opts, el) -> push a scheme onto an element (CSS vars)

  get colorScheme() {
    return _activeScheme;

  get typography() {

  defaultColorScheme,
  vibrantColorScheme,
  install(options = {}, target = document.documentElement) {

    installThemeVariables(_activeScheme, target);

  provide(options, target) {
    return this.install(options, target);

/*
 * Shared helpers for SpatialUI web components.

// install() has run, or inside disconnected trees).

  fillPrimary: "--sui-fill-primary",
  fillSecondary: "--sui-fill-secondary",
  fillTertiary: "--sui-fill-tertiary",
  fillLight: "--sui-fill-light",
  labelPrimaryLight: "--sui-label-primary-light",
  labelPrimary: "--sui-label-primary",
  labelSecondary: "--sui-label-secondary",
  labelTertiary: "--sui-label-tertiary",
  labelQuaternary: "--sui-label-quaternary",
  lightenHover: "--sui-lighten-hover",
  lightenPressed: "--sui-lighten-pressed",
  error: "--sui-error",
  alert: "--sui-alert",
  passable: "--sui-passable",
  interaction: "--sui-interaction",
  dividerLine: "--sui-divider-line",

  constructor() {
    super();
    this.attachShadow({ mode: "open" });
  }
  connectedCallback() {
    if (!this._rendered) {
      this.render();
      this._rendered = true;
    }
  }
  attributeChangedCallback() {
    if (this._rendered) this.render();
  }
  bool(name) {
    return this.hasAttribute(name) && this.getAttribute(name) !== "false";
  }
  attr(name, fallback = null) {
    return this.getAttribute(name) ?? fallback;
  }
  num(name, fallback) {

    return v == null ? fallback : parseFloat(v);

  "top-left-front": { x: 0, y: 0, z: 1 },

  "top-center-front": { x: 0.5, y: 0, z: 1 },

  "top-right-front": { x: 1, y: 0, z: 1 },
  left: { x: 0, y: 0.5, z: 1 },
  "center-left": { x: 0, y: 0.5, z: 1 },
  "center-left-front": { x: 0, y: 0.5, z: 1 },
  center: { x: 0.5, y: 0.5, z: 1 },
  front: { x: 0.5, y: 0.5, z: 1 },
  "center-front": { x: 0.5, y: 0.5, z: 1 },
  right: { x: 1, y: 0.5, z: 1 },
  "center-right": { x: 1, y: 0.5, z: 1 },
  "center-right-front": { x: 1, y: 0.5, z: 1 },
  "bottom-left": { x: 0, y: 1, z: 1 },
  "bottom-left-front": { x: 0, y: 1, z: 1 },
  bottom: { x: 0.5, y: 1, z: 1 },
  "bottom-center": { x: 0.5, y: 1, z: 1 },
  "bottom-front": { x: 0.5, y: 1, z: 1 },
  "bottom-center-front": { x: 0.5, y: 1, z: 1 },
  "bottom-right": { x: 1, y: 1, z: 1 },
  "bottom-right-front": { x: 1, y: 1, z: 1 },

function finite(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

/** Parse a named point or an "x,y,z" normalized tuple. */
function parseNormalizedPoint(value, fallback = "center") {
  const source = String(value || fallback).trim();
  const tuple = source.split(",").map((part) => Number(part.trim()));
  if (tuple.length >= 2 && tuple.every(Number.isFinite)) {
    return { x: tuple[0], y: tuple[1], z: tuple[2] ?? 1 };
  }

  const normalized = source
    .trim()
    .replace(/([a-z0-9])([A-Z])/g, "$1-$2")
    .replace(/[_.\s]+/g, "-")
    .toLowerCase();
  if (NAMED_POINTS[normalized]) return { ...NAMED_POINTS[normalized] };
  return { ...(NAMED_POINTS[fallback] || NAMED_POINTS.center) };
}

/** Align one normalized content point to a normalized point on the host. */
function computeAugmentPosition(
  anchorRect,
  contentSize,
  anchorPoint,
  contentAlignment,
  offset = {},
) {
  return {
    x: anchorRect.left + anchorRect.width * anchorPoint.x
      - contentSize.width * contentAlignment.x + finite(offset.x),
    y: anchorRect.top + anchorRect.height * anchorPoint.y
      - contentSize.height * contentAlignment.y + finite(offset.y),
    z: finite(offset.z),
  };
}

function horizontalPosition(anchorRect, width, placement, direction) {
  const rtl = direction === "rtl";
  switch (placement) {
    case "to-start-of": return rtl ? anchorRect.right : anchorRect.left - width;
    case "center": return anchorRect.left + (anchorRect.width - width) / 2;
    case "align-end": return rtl ? anchorRect.left : anchorRect.right - width;
    case "to-end-of": return rtl ? anchorRect.left - width : anchorRect.right;
    case "align-start":
    default: return rtl ? anchorRect.right - width : anchorRect.left;
  }
}

function verticalPosition(anchorRect, height, placement) {
  switch (placement) {
    case "align-top": return anchorRect.top;
    case "center": return anchorRect.top + (anchorRect.height - height) / 2;
    case "align-bottom": return anchorRect.bottom - height;
    case "below": return anchorRect.bottom;
    case "above":
    default: return anchorRect.top - height;
  }
}

/** Position a popup with the SDK HorizontalPlacement/VerticalPlacement model. */
function computePopupPosition(
  anchorRect,
  contentSize,
  horizontalPlacement = "align-start",
  verticalPlacement = "above",
  offset = {},
  direction = "ltr",
) {
  return {
    x: horizontalPosition(anchorRect, contentSize.width, horizontalPlacement, direction)
      + finite(offset.x),
    y: verticalPosition(anchorRect, contentSize.height, verticalPlacement) + finite(offset.y),
    z: finite(offset.z),
  };
}

/** Clamp a popup to a viewport when clipping-enabled is explicitly requested. */
function clampPosition(position, contentSize, viewport, padding = 0) {
  const maxX = Math.max(padding, viewport.width - contentSize.width - padding);
  const maxY = Math.max(padding, viewport.height - contentSize.height - padding);
  return {
    ...position,
    x: Math.min(Math.max(position.x, padding), maxX),
    y: Math.min(Math.max(position.y, padding), maxY),
  };
}


/* ===== overlay.js ===== */
/* Shared top-layer lifecycle for SpatialUI floating window components. */

let nextOverlayLayer = 0;

const overlayCss = [
  ":host {",
  "position:fixed;inset:auto;top:0;left:0;display:block;width:max-content;margin:0;padding:0;",
  "border:0;overflow:visible;color:inherit;background:transparent;font-family:inherit;",
  "pointer-events:auto;z-index:var(--sui-overlay-z-index,1000);",
  "transform:translate3d(var(--sui-overlay-x,0px),var(--sui-overlay-y,0px),var(--sui-overlay-z,0px))",
  "rotateX(var(--sui-overlay-rotate-x,0deg)) rotateY(var(--sui-overlay-rotate-y,0deg))",
  "rotateZ(var(--sui-overlay-rotate-z,0deg));",
  "transform-origin:var(--sui-overlay-origin-x,50%) var(--sui-overlay-origin-y,50%);}",
  ":host([hidden]){display:none!important;}",
  "*,*::before,*::after{box-sizing:border-box;}",
  ".surface{position:relative;display:flex;color:var(--sui-label-primary);",
  "box-sizing:border-box;overflow:hidden;isolation:isolate;",
  "box-shadow:0 18px 54px rgba(0,0,0,.24),inset 0 0 0 1px ",
  "var(--sui-overlay-border,rgba(255,255,255,.28));}",
  ".surface.material-regular{background:var(--Background-MaterialRegular,rgba(255,255,255,.34));",
  "backdrop-filter:blur(50px) saturate(1.18);-webkit-backdrop-filter:blur(50px) saturate(1.18);}",
  ".surface.material-thick{background:var(--Background-MaterialThick,rgba(255,255,255,.58));",
  "backdrop-filter:blur(64px) saturate(1.22);-webkit-backdrop-filter:blur(64px) saturate(1.22);}",
  ".surface.material-none{background:transparent;box-shadow:none;}",
  "::slotted(*){box-sizing:border-box;}",
].join("");

function numericAttribute(element, name, fallback = 0) {
  const value = Number(element.getAttribute(name));
  return Number.isFinite(value) ? value : fallback;
}

/** Base class used by sui-augment and sui-spatial-popup. */
class SuiOverlayElement extends SuiElement {
  constructor() {
    super();
    this._anchorElement = null;
    this._positionFrame = 0;
    this._overlayCleanup = [];
  }

  get anchorElement() { return this._anchorElement; }

  set anchorElement(value) {
    if (value !== null && !(value instanceof Element)) {
      throw new TypeError("anchorElement must be an Element or null");
    }
    this._anchorElement = value;
    if (this.isConnected) this._activateOverlay();
  }

  connectedCallback() {
    super.connectedCallback();
    this.setAttribute("popover", "manual");
    this.style.setProperty("--sui-overlay-z-index", String(1000 + nextOverlayLayer++));
    this._activateOverlay();
  }

  disconnectedCallback() {
    this._deactivateOverlay();
    try { this.hidePopover?.(); } catch (_) { /* Already detached or unsupported. */ }
  }

  attributeChangedCallback(name, oldValue, newValue) {
    super.attributeChangedCallback(name, oldValue, newValue);
    if (oldValue !== newValue && this.isConnected) this._activateOverlay();
  }

  resolveAnchor() {
    if (this._anchorElement?.isConnected) return this._anchorElement;
    const id = this.getAttribute("for");
    if (id) {
      const root = this.getRootNode();
      return root.getElementById?.(id) || this.ownerDocument?.getElementById(id) || null;
    }
    return this.previousElementSibling || this.parentElement;
  }

  shouldDismissOnOutsidePointer() { return false; }
  shouldDismissOnEscape() { return false; }

  requestDismiss(reason, sourceEvent) {
    emit(this, "dismiss-request", { reason, sourceEvent });
  }

  _deactivateOverlay() {
    if (this._positionFrame) cancelAnimationFrame(this._positionFrame);
    this._positionFrame = 0;
    this._overlayCleanup.splice(0).forEach((cleanup) => cleanup());
  }

  _activateOverlay() {
    this._deactivateOverlay();
    if (this.hidden) return;
    try {
      if (!this.matches(":popover-open")) this.showPopover?.();
    } catch (_) { /* Fixed-position fallback. */ }

    const anchor = this.resolveAnchor();
    const surface = this.shadowRoot.querySelector(".surface");
    if (!anchor || !surface) {
      this.style.visibility = "hidden";
      const mutationObserver = new MutationObserver(() => {
        if (this.resolveAnchor()) this._activateOverlay();
      });
      mutationObserver.observe(this.ownerDocument.documentElement, { childList: true, subtree: true });
      this._overlayCleanup.push(() => mutationObserver.disconnect());
      return;
    }

    this.style.visibility = "hidden";
    const schedule = () => {
      if (this._positionFrame) return;
      this._positionFrame = requestAnimationFrame(() => {
        this._positionFrame = 0;
        this._updatePosition(anchor, surface);
      });
    };

    if (typeof ResizeObserver !== "undefined") {
      const resizeObserver = new ResizeObserver(schedule);
      resizeObserver.observe(anchor);
      resizeObserver.observe(surface);
      this._overlayCleanup.push(() => resizeObserver.disconnect());
    }
    window.addEventListener("resize", schedule);
    window.addEventListener("scroll", schedule, true);
    this._overlayCleanup.push(() => window.removeEventListener("resize", schedule));
    this._overlayCleanup.push(() => window.removeEventListener("scroll", schedule, true));

    if (this.shouldDismissOnOutsidePointer()) {
      const onPointerDown = (event) => {
        const path = event.composedPath();
        const insideNestedOverlay = path.some((node) =>
          node instanceof SuiOverlayElement && this.contains(node));
        if (!path.includes(this) && !path.includes(anchor) && !insideNestedOverlay) {
          this.requestDismiss("outside-pointer", event);
        }
      };
      this.ownerDocument.addEventListener("pointerdown", onPointerDown, true);
      this._overlayCleanup.push(() =>
        this.ownerDocument.removeEventListener("pointerdown", onPointerDown, true));
    }

    if (this.shouldDismissOnEscape()) {
      const onKeyDown = (event) => {
        if (event.key === "Escape" && !event.defaultPrevented) {
          event.preventDefault();
          this.requestDismiss("escape-key", event);
        }
      };
      this.ownerDocument.addEventListener("keydown", onKeyDown, true);
      this._overlayCleanup.push(() =>
        this.ownerDocument.removeEventListener("keydown", onKeyDown, true));
    }
    schedule();
  }

  _updatePosition(anchor, surface) {
    if (!this.isConnected || !anchor.isConnected) {
      this.style.visibility = "hidden";
      return;
    }
    this.prepareSurface(anchor, surface);
    const anchorRect = anchor.getBoundingClientRect();
    const contentSize = { width: surface.offsetWidth, height: surface.offsetHeight };
    let position = this.calculatePosition(anchorRect, contentSize, anchor);
    if (this.bool("clipping-enabled")) {
      position = clampPosition(
        position,
        contentSize,
        { width: window.innerWidth, height: window.innerHeight },
        numericAttribute(this, "viewport-padding", 0),
      );
    }
    this.style.setProperty("--sui-overlay-x", position.x + "px");
    this.style.setProperty("--sui-overlay-y", position.y + "px");
    this.style.setProperty("--sui-overlay-z", (position.z || 0) + "px");
    this.style.setProperty(
      "--sui-overlay-rotate-x",
      numericAttribute(this, "rotation-x", 0) + "deg",
    );
    this.style.setProperty(
      "--sui-overlay-rotate-y",
      numericAttribute(this, "rotation-y", 0) + "deg",
    );
    this.style.setProperty(
      "--sui-overlay-rotate-z",
      numericAttribute(this, "rotation-z", 0) + "deg",
    );
    this.style.visibility = "visible";
  }

  prepareSurface() {}
  calculatePosition() { return { x: 0, y: 0, z: 0 }; }

  offset(defaultY = 0) {
    return {
      x: numericAttribute(this, "offset-x", 0),
      y: numericAttribute(this, "offset-y", defaultY),
      z: numericAttribute(this, "offset-z", 0),
    };
  }
}

/* ===== chip.js ===== */
{
/*
 * Chips — mirrors Chips.kt (ButtonChip / ToggleableChip / RemovableChip).
 * Sizes: Small h=32 (r=16, hpad 16 / with leading 12), Regular h=40 (r=38, hpad 20 / with leading 16).
 * Kotlin default colors (from defaultChipColors / defaultToggleableChipColors):
 *   ButtonChip:         container=fillSecondary, content=labelPrimary
 *   ToggleableChip off: container=fillTertiary,  content=labelPrimary
 *   ToggleableChip on:  container=fillSecondary, content=labelPrimary
 */

const SIZES = {
  small: { h: 32, r: 16, hpad: 16, hpadLeading: 12, fs: 14, lh: 18, fw: 600 },
  regular: { h: 40, r: 38, hpad: 20, hpadLeading: 16, fs: 16, lh: 20, fw: 600 },
};

class SuiChip extends SuiElement {
  static get observedAttributes() { return ["size", "disabled", "selected", "toggle", "removable", "label", "leading-icon", "container-color", "content-color"]; }
  render() {
    const s = SIZES[this.attr("size", "small").toLowerCase()] || SIZES.small;
    const disabled = this.bool("disabled");
    const toggle = this.bool("toggle");
    const selected = this.bool("selected");
    const removable = this.bool("removable");
    const leadingIcon = this.attr("leading-icon");
    const hasLeading = leadingIcon != null;
    const active = toggle && selected;
    const defaultBg = active ? themeColor("fillSecondary") : (toggle ? themeColor("fillTertiary") : themeColor("fillSecondary"));
    const defaultFg = themeColor("labelPrimary");
    const bg = this.attr("container-color", defaultBg);
    const fg = this.attr("content-color", defaultFg);
    const hpad = hasLeading ? s.hpadLeading : s.hpad;
    this.shadowRoot.innerHTML = `
      <style>
        :host { display:inline-flex; }
        .chip { display:inline-flex; align-items:center; gap:4px; height:${s.h}px;
          padding:0 ${hpad}px; border-radius:${s.r}px; background:${bg}; color:${fg};
          font-weight:${s.fw}; font-size:${s.fs}px; line-height:${s.lh}px; font-family:inherit;
          cursor:pointer; user-select:none; position:relative; overflow:hidden;
          transition:background-color .12s ease; }
        .chip.sui-disabled { opacity: var(--sui-disable-alpha, 0.4); pointer-events: none; }
        .chip::after { content:""; position:absolute; inset:0; background:transparent; transition:background-color .12s; pointer-events:none; }
        .chip:hover::after { background: var(--sui-lighten-hover, rgba(255,255,255,0.12)); }
        .chip:active::after { background: var(--sui-lighten-pressed, rgba(255,255,255,0.20)); }
        .lead { display:inline-flex; width:${s.fs + 2}px; height:${s.fs + 2}px; align-items:center; justify-content:center; }
        .close { margin-left:2px; opacity:.8; font-size:${s.fs}px; }
      </style>
      <div class="chip ${disabled ? "sui-disabled" : ""}" role="button">
        ${hasLeading ? `<span class="lead">${leadingIcon}</span>` : ""}
        <span><slot>${this.attr("label", "Chip")}</slot></span>
        ${removable ? `<span class="close">✕</span>` : ""}
      </div>`;
    this.shadowRoot.querySelector(".chip").addEventListener("click", (e) => {
      if (disabled) return;
      if (removable && e.target.classList.contains("close")) {
        emit(this, "remove", {});
        return;
      }
      if (toggle) {
        const next = !selected;
        this.toggleAttribute("selected", next);
        emit(this, "checked-change", { selected: next });
      }
      emit(this, "click-action", {});
    });
  }
}
define("sui-chip", SuiChip);

}

/* ===== slider.js ===== */
{
/*
 * Slider — mirrors Slider.kt / Figma "Slider" component set.
 * Sizes only govern thickness (track height / knob dot / thumb area):
 *   Small   8 / 18 / 32
 *   Regular 24 / 18 / 32
 *   Max     48 / 32 / 48
 * Length is independent of size (Figma's 240/360 artboards are just example
 * frames). Width defaults to 240px and is overridable via the `width` attribute
 * ("240", "320px", "100%", …) so sliders align regardless of size.
 * Colors are driven by PicoTheme (fillTertiary / fillSecondary / labelPrimaryLight)
 * and may be overridden per-instance with track-color / progress-color / thumb-color.
 */

const SPECS = {
  small: { track: 8, thumb: 18, area: 32 },
  regular: { track: 24, thumb: 18, area: 32 },
  max: { track: 48, thumb: 32, area: 48 },
};

const DEFAULT_WIDTH = 240;

class SuiSlider extends SuiElement {
  static get observedAttributes() { return ["value", "min", "max", "size", "width", "disabled", "track-color", "progress-color", "thumb-color"]; }
  attributeChangedCallback(name) {
    if (name === "value" && this._internalWrite) return;
    super.attributeChangedCallback(name);
  }
  render() {
    const s = SPECS[this.attr("size", "regular").toLowerCase()] || SPECS.regular;
    const disabled = this.bool("disabled");
    const min = this.num("min", 0), max = this.num("max", 1);
    const rawW = this.attr("width");
    const width = rawW == null ? `${DEFAULT_WIDTH}px` : (/^\d+$/.test(rawW) ? `${rawW}px` : rawW);
    // `value` is the single source of truth: re-sync on every render so an
    // external (controlled) update is reflected, keeping the last committed
    // value when the attribute is absent.
    this._value = this.hasAttribute("value") ? this.num("value", 0) : (this._value ?? 0);

    const trackColor = this.attr("track-color", themeColor("fillTertiary"));
    const progressColor = this.attr("progress-color", themeColor("fillSecondary"));
    const thumbColor = this.attr("thumb-color", themeColor("labelPrimaryLight"));

    this.shadowRoot.innerHTML = `
      <style>
        :host { display:inline-flex; }
        .slider { position:relative; width:${width}; height:${s.area}px; display:flex; align-items:center;
          cursor:pointer; touch-action:none; }
        .slider.sui-disabled { opacity: var(--sui-disable-alpha, 0.4); pointer-events: none; }
        .track, .progress { position:absolute; top:50%; transform:translateY(-50%);
          height:${s.track}px; border-radius:${s.track / 2}px; }
        .track { left:0; right:0; background:${trackColor}; }
        .progress { left:0; width:0;
          background:${progressColor}; overflow:hidden; }
        .progress::after { content:""; position:absolute; inset:0; background:transparent;
          transition:background-color .12s ease; pointer-events:none; }
        .slider:hover .progress::after, .slider.dragging .progress::after {
          background: var(--sui-lighten-hover, rgba(255,255,255,0.12)); }
        .thumb { position:absolute; top:50%; transform:translateY(-50%); z-index:1;
          width:${s.thumb}px; height:${s.thumb}px; border-radius:50%;
          background:${thumbColor}; box-shadow:0 0 4px 0 rgba(0,0,0,0.12); }
      </style>
      <div class="slider ${disabled ? "sui-disabled" : ""}" role="slider" tabindex="0" aria-valuenow="${this._value}" aria-valuemin="${min}" aria-valuemax="${max}">
        <div class="track"></div>
        <div class="progress"></div>
        <div class="thumb"></div>
      </div>`;

    const el = this.shadowRoot.querySelector(".slider");
    const progress = this.shadowRoot.querySelector(".progress");
    const thumb = this.shadowRoot.querySelector(".thumb");

    // Position the thumb/progress from the current value — no DOM rebuild.
    // Measure the actual rendered width so percentage / responsive widths work.
    // Match the native/Figma geometry: the invisible thumb area travels inside
    // the component, while the visible knob is centered within that area. The
    // rounded progress cap extends behind the knob so no square cut is exposed.
    const paint = () => {
      const len = el.getBoundingClientRect().width || DEFAULT_WIDTH;
      const travel = Math.max(0, len - s.area);
      const range = max - min;
      const frac = range === 0 ? 0 : Math.max(0, Math.min(1, (this._value - min) / range));
      const thumbAreaLeft = frac * travel;
      const progressWidth = Math.min(len, s.track + thumbAreaLeft);
      progress.style.width = `${progressWidth}px`;
      thumb.style.left = `${thumbAreaLeft + (s.area - s.thumb) / 2}px`;
      el.setAttribute("aria-valuenow", String(this._value));
    };
    paint();

    if (disabled) return;

    const setFromX = (clientX) => {
      const rect = el.getBoundingClientRect();
      const travel = Math.max(1, rect.width - s.area);
      const frac = Math.max(
        0,
        Math.min(1, (clientX - rect.left - s.area / 2) / travel),
      );
      this._value = min + frac * (max - min);
      this._internalWrite = true;
      this.setAttribute("value", String(this._value));
      this._internalWrite = false;
      paint();
      emit(this, "value-change", { value: this._value });
    };

    const move = (ev) => setFromX(ev.clientX);
    const up = (ev) => {
      el.classList.remove("dragging");
      el.releasePointerCapture?.(ev.pointerId);
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
    el.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      el.classList.add("dragging");
      el.setPointerCapture?.(ev.pointerId);
      setFromX(ev.clientX);
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });
    // Keyboard support.
    el.addEventListener("keydown", (ev) => {
      const stepPx = (max - min) / 100;
      if (ev.key === "ArrowRight" || ev.key === "ArrowUp") { this._value = Math.min(max, this._value + stepPx); }
      else if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") { this._value = Math.max(min, this._value - stepPx); }
      else return;
      ev.preventDefault();
      this._internalWrite = true;
      this.setAttribute("value", String(this._value));
      this._internalWrite = false;
      paint();
      emit(this, "value-change", { value: this._value });
    });
  }
}
define("sui-slider", SuiSlider);

}

/* ===== progress.js ===== */
{
/*
 * ProgressIndicators — mirrors LinearProgressIndicator.kt & CircularProgressIndicator.kt.
 * Linear: width 240, Small h=4 / Regular h=8. Circular: Small 20 / Regular 30 / Max 40, stroke=10% of size (min 2).
 * Colors (from Kotlin defaults):
 *   Linear:   track=fillTertiary, bar=labelPrimaryLight
 *   Circular: track=fillTertiary, bar=interaction (determinate) / labelPrimaryLight (indeterminate)
 */

class SuiLinearProgress extends SuiElement {
  static get observedAttributes() { return ["value", "size", "indeterminate", "track-color", "progress-color"]; }
  render() {
    const h = this.attr("size", "regular").toLowerCase() === "small" ? 4 : 8;
    const indeterminate = this.bool("indeterminate");
    const value = Math.max(0, Math.min(1, this.num("value", 0.4)));
    const trackC = this.attr("track-color", themeColor("fillTertiary"));
    const barC = this.attr("progress-color", themeColor("labelPrimaryLight"));
    this.shadowRoot.innerHTML = `
      <style>
        :host { display:inline-flex; }
        .track { width:240px; height:${h}px; border-radius:${h / 2}px; background:${trackC}; overflow:hidden; position:relative; }
        .bar { position:absolute; top:0; bottom:0; background:${barC}; border-radius:${h / 2}px; }
        .det { left:0; width:${value * 100}%; }
        .indet { width:40%; animation:sui-linear 1.4s infinite; }
        @keyframes sui-linear { 0%{left:-40%} 100%{left:100%} }
      </style>
      <div class="track"><div class="bar ${indeterminate ? "indet" : "det"}"></div></div>`;
  }
}
define("sui-linear-progress", SuiLinearProgress);

const CIRC = { small: 20, regular: 30, max: 40 };

class SuiCircularProgress extends SuiElement {
  static get observedAttributes() { return ["value", "size", "indeterminate", "track-color", "progress-color"]; }
  render() {
    const size = CIRC[this.attr("size", "max").toLowerCase()] || CIRC.max;
    const stroke = Math.max(2, size * 0.1);
    const indeterminate = this.bool("indeterminate");
    const value = Math.max(0, Math.min(1, this.num("value", 0.6)));
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const dash = indeterminate ? c * 0.25 : c * value;
    const trackC = this.attr("track-color", themeColor("fillTertiary"));
    const defaultBar = indeterminate ? themeColor("labelPrimaryLight") : themeColor("interaction");
    const barC = this.attr("progress-color", defaultBar);
    this.shadowRoot.innerHTML = `
      <style>
        :host { display:inline-flex; }
        svg { transform: rotate(-90deg); }
        .spin { transform-origin:center; animation:sui-spin 1s linear infinite; }
        @keyframes sui-spin { to { transform: rotate(270deg); } }
      </style>
      <svg width="${size}" height="${size}" class="${indeterminate ? "spin" : ""}">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none"
          stroke="${trackC}" stroke-width="${stroke}"/>
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none"
          stroke="${barC}" stroke-width="${stroke}" stroke-linecap="round"
          stroke-dasharray="${dash} ${c}"/>
      </svg>`;
  }
}
define("sui-circular-progress", SuiCircularProgress);

}

/* ===== segment-control.js ===== */
{
/*
 * SegmentControls — mirrors SegmentControls.kt.
 * Container bg=fillTertiary, container padding 4, item gap 4.

 * Selected item bg=fillSecondary / content=labelPrimary; unselected content=labelTertiary.

class SuiSegmentControl extends SuiElement {

/* ===== tab-bar.js ===== */
{
/*
 * TabBar — mirrors the PICO OS 7 Tab Bar specification.
 * Supports horizontal text/icon tabs, icon labels, vertical icon tabs,
 * badges, hover expansion, and an optional secondary tab row.
 * Icon slots use icon-N; the hover menu can override them with expanded-icon-N.
 *
 * Colors are driven by PicoTheme:
 *   - Material bar background = component-level glass variable
 *   - Active tab = fillPrimary / labelPrimaryLight
 *   - Inactive tab = dark label on the light material
 *   - Focus ring = interaction
 *   - Badge = error
 */

const DEFAULT_ICONS = ["◷", "♧", "◇", "▤", "▭", "⌕", "○"];

function list(value, preserveEmpty = false) {
  const values = (value || "").split(",").map((item) => item.trim()).slice(0, 7);
  return preserveEmpty ? values : values.filter(Boolean);
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

class SuiTabBar extends SuiElement {
  static get observedAttributes() {
    return [
      "items", "icons", "badges", "selected-index", "type", "orientation",
      "show-labels", "expand-on-hover", "sub-items", "sub-selected-index",
      "disabled", "equal-width",
    ];
  }

  render() {
    const previousBar = this.shadowRoot.querySelector(".bar");
    const items = list(this.attr("items", "最近,通知,空间,文章,书库,搜索"));
    const icons = list(this.attr("icons", ""), true);
    const badges = list(this.attr("badges", ""), true);
    const subItems = list(this.attr("sub-items", ""));
    const type = this.attr("type", "icon").toLowerCase();
    const vertical = this.attr("orientation", "horizontal").toLowerCase() === "vertical";
    const showLabels = !vertical && type === "icon" && this.bool("show-labels");
    const expandOnHover = this.hasAttribute("expand-on-hover")
      ? this.bool("expand-on-hover")
      : !vertical && type === "icon" && !showLabels;
    const horizontalHoverLabels = !vertical && type === "icon" && expandOnHover;
    const verticalHoverPanel = vertical && expandOnHover;
    this._expanded = Boolean(
      expandOnHover && (
        this._expanded ||
        previousBar?.matches(":hover") ||
        previousBar?.matches(":focus-within")
      )
    );
    const equalWidth = this.bool("equal-width");
    const selected = Math.min(Math.max(this.num("selected-index", 0), 0), Math.max(items.length - 1, 0));
    const subSelected = Math.min(
      Math.max(this.num("sub-selected-index", 0), 0),
      Math.max(subItems.length - 1, 0),
    );
    const hasSubTabs = !vertical && type === "icon" && showLabels && subItems.length > 0;
    const mode = vertical ? "vertical" : type === "icon" ? "icon-mode" : "text-mode";

    const barBg = "var(--Background-MaterialRegular, rgba(255, 255, 255, .34))";
    const barBorder = `var(--Line-Border,
      var(--sui-tab-bar-border, color(display-p3 1 1 1 / .34)))`;
    const activeTabBg = themeColor("fillPrimary");
    const activeTabFg = themeColor("labelPrimaryLight");
    const inactiveFg = themeColor("labelPrimary");
    const verticalActiveBg = themeColor("fillPrimary");
    const subActiveBg = themeColor("fillPrimary");
    const subActiveFg = themeColor("labelPrimaryLight");
    const focusRing = themeColor("interaction");
    const badgeBg = themeColor("error");
    const badgeFg = themeColor("labelPrimaryLight");
    const hoverOverlay = "var(--sui-lighten-hover, rgba(255,255,255,0.12))";

    const tabs = items.map((label, index) => {
      const active = index === selected;
      const badge = badges[index];
      const icon = icons[index] || DEFAULT_ICONS[index % DEFAULT_ICONS.length];
      const iconContent = `
        <span class="glyph" aria-hidden="true">
          <slot name="icon-${index}">${escapeHtml(icon)}</slot>
        </span>`;
      const labelContent = `<span class="label">${escapeHtml(label)}</span>`;
      return `
        <button class="tab ${active ? "active" : ""}" role="tab"
          aria-selected="${active}" tabindex="${active ? 0 : -1}" data-index="${index}">
          ${mode === "text-mode" ? labelContent : iconContent}
          ${showLabels || horizontalHoverLabels ? labelContent : ""}
          ${badge ? `<span class="badge" aria-label="${escapeHtml(badge)}">${escapeHtml(badge)}</span>` : ""}
        </button>`;
    }).join("");

    const hoverTabs = verticalHoverPanel ? items.map((label, index) => {
      const active = index === selected;
      const badge = badges[index];
      const icon = icons[index] || DEFAULT_ICONS[index % DEFAULT_ICONS.length];
      return `
        <button class="hover-tab ${active ? "active" : ""}" role="tab"
          aria-selected="${active}" tabindex="${active ? 0 : -1}" data-index="${index}">
          <span class="glyph" aria-hidden="true">
            <slot name="expanded-icon-${index}">${escapeHtml(icon)}</slot>
          </span>
          <span class="hover-label">${escapeHtml(label)}</span>
          ${badge ? `<span class="badge" aria-label="${escapeHtml(badge)}">${escapeHtml(badge)}</span>` : ""}
        </button>`;
    }).join("") : "";

    const subTabs = subItems.map((label, index) => `
      <button class="sub-tab ${index === subSelected ? "active" : ""}" role="tab"
        aria-selected="${index === subSelected}" tabindex="${index === subSelected ? 0 : -1}"
        data-sub-index="${index}">${escapeHtml(label)}</button>
    `).join("");

    this.shadowRoot.innerHTML = `
      <style>
        :host {
          display: inline-flex;
          box-sizing: border-box;
